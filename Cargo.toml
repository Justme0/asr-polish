[package]
name = "asr-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
# Blocking HTTP client for proxying audio to the Python sidecar (--backend python).
# TLS disabled: the sidecar is plain HTTP on localhost, so we avoid pulling in
# the rustls/OpenSSL dependency tree.
ureq = { version = "2", default-features = false }

[build-dependencies]
cc = "1"
